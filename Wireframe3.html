<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Sim</title>
    <script src="https://kit.fontawesome.com/d1a7ef58e3.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="Wireframe3_Style.css">
</head>
<body>
    <div class="chat-container">    
        <div class="chat-header">
            <button class="back-btn" id="back-btn">
                <i class="fa-solid fa-circle-chevron-left"></i>
            </button>
            <div class="header-profile">
                <div class="pfp-circle-container">
                    <img class="pfp-portrait" id= "match-pfp" src="https://images.unsplash.com/photo-1636548646163-a14de6514ce0?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D">
                </div>
                <h3 id="match-name">Karen</h3>
            </div>
            <button class="meatball-menu" id="meatball-menu">
                <i class="fa-solid fa-ellipsis"></i>
            </button>
            <!-- <select id="script-control" class="script-select">
                <option value="0">Version A</option>
                <option value="1">Version B</option>
                <option value="2">Version C</option>        Old, uncomment if want the old script switching back
                <option value="3">Version D</option>
                <option value="4">Version E</option>
            </select>
        -->
            <div id="dropdown-menu" class="dropdown-menu hidden">
                <button class="menu-item" id="viewProfile-btn">View Profile</button>
                <button class="menu-item" id="switch-match-btn">Switch Match</button>
                <button class="menu-item">Block User</button>
                <button class="menu-item">Report</button>
            </div>
            <!-- <span class="info">After 5 messages, the intervention will be prompted</span> -->
        </div>
        <div id="message-list" class="message-list">
           <!-- <div class="message match-msg"> Hello!</div>
            <div class="message user-msg">Hey!</div>
            <div class="message match-msg"> This is where script message 2 would go...</div>
            <div class="message user-msg">And then sample script!</div>
            <div class="message match-msg"> And then the third</div>
            <div class="message user-msg">And then sample script!</div>
            <div class="message match-msg"> And then the fourth</div>
            <div class="message user-msg">And then sample script!</div>
            <div class="message match-msg"> Time for you to send a message now!</div> -->
        </div> 
        <!-- From Uiverse.io by mrhyddenn --> 
        
        <div class="chat-input-area">
            <textarea type="text" rows = "1" id="user-input" placeholder="Get the conversation started..."></textarea>
            <button id="send-btn" class="send-arrow-btn">
                <i class="fa-solid fa-arrow-up"></i>
            </button>
        </div>
    </div>
    <div id="profile-page" class="profile-page hidden">
        <div class="profile-page-content">
            <button id="close-profile-btn" class="close-profile-btn">&times;</button>
            <div class="profile-page-img-container">
                <img id="page-pfp" class="profile-page-img" src="" alt="Profile Photo">
            </div>
            <div class="profile-page-info">
                <h2 id="page-name">Name, Age</h2>
                <p id="page-meta" class="profile-meta-text" style="color: #8e8e93; font-size: 14px; margin: -5px 0 5px 0;"></p>
                <p id="page-bio" class="profile-bio-text">This is a short sample bio for the wireframe simulation.</p>
            </div>
        </div>
    </div>

    <div id="custom-intprompt" class="intprompt hidden">
        <div class="prompt-content">
            <h3>Are you sure you want to send?</h3>
            <p>Think twice - your match may find this language disrespectful.</p>
            <button id="intprompt-edit">Edit Message</button>
            <button id="intprompt-confirm">Send Anyway</button>
        </div>
    </div>
    <script src="Wireframe3_Script.js"></script>
</body>
</html>
